name: Build Aura Music Desktop (Windows & Linux)

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux Universal AppImage
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Linux AppImage
        run: npx electron-builder --linux AppImage --publish never

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Music-Linux
          path: dist/*.AppImage

      - name: Create or Update GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: dist/*.AppImage
          name: Aura Music Desktop ${{ github.ref_name }}
          draft: false
          prerelease: false

  build-windows:
    name: Build Windows Release (Installer & Portable)
    runs-on: windows-2022
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Windows Installer & Zip
        run: npx electron-builder --win nsis zip --publish never

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aura-Music-Windows
          path: |
            dist/*.exe
            dist/*.zip

      - name: Create or Update GitHub Release on Tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            dist/*.exe
            dist/*.zip
          name: Aura Music Desktop ${{ github.ref_name }}
          draft: false
          prerelease: false
